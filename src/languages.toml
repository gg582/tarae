# ── Grammar sources. Only `core = true` (what's used to hack on tarae itself — rust·toml·markdown·comment) goes into the default build.
#    The rest: asked (y) on first opening a file, then `grammar.rs` fetches via git and builds with cc.
#    `bundle = true` goes into the binary when built with `--features bundled-grammars` (source = runtime/grammars.tar.gz,
#    packed at these commits by `cargo xtask vendor-grammars` — core is a subset of bundle).
# Commits must match the queries (runtime/queries, taken from Helix 25.07.1) — when bumping, check the queries too.

[[grammar]]
name = "bash"
bundle = true
git = "https://github.com/tree-sitter/tree-sitter-bash"
rev = "487734f87fd87118028a65a4599352fa99c9cde8"

