# Language table — name (= query directory queries/<name>/), grammar (= grammars/<grammar>.so, defaults to the name),
# extensions, exact file names, path suffixes (path-suffixes — narrow common names by path), path patterns (globs — one `*` per segment). Grammars and queries themselves are looked up in the runtime directory (runtime.rs).
# Names match the directory names of the queries (runtime/queries, taken from Helix).

[[language]]
name = "rust"
extensions = ["rs"]

[[language]]
name = "python"
extensions = ["py", "pyi", "pyw"]

[[language]]
name = "go"
extensions = ["go"]

[[language]]
name = "gomod"
filenames = ["go.mod"]

[[language]]
name = "javascript"
extensions = ["js", "mjs", "cjs"]

[[language]]
name = "jsx"
grammar = "javascript"
extensions = ["jsx"]

[[language]]
name = "typescript"
extensions = ["ts", "mts", "cts"]

[[language]]
name = "tsx"
extensions = ["tsx"]

[[language]]
name = "json"
extensions = ["json", "jsonc", "json5"]
filenames = ["flake.lock", ".prettierrc", ".babelrc"]

[[language]]
name = "toml"
extensions = ["toml"]
filenames = ["Cargo.lock", "uv.lock"]

# Helm chart templates — grammar is Go template, text between `{{ }}` is injected as YAML (queries/helm/injections.scm)
[[language]]
name = "helm"
grammar = "gotmpl"
globs = ["templates/*.yaml", "templates/*.yml", "templates/_*.tpl", "templates/NOTES.txt"]

[[language]]
name = "gotmpl"
extensions = ["gotmpl"]

[[language]]
name = "yaml"
extensions = ["yml", "yaml"]

[[language]]
name = "markdown"
extensions = ["md", "markdown"]

# Injection only (no extension) — bold·code·links inside markdown paragraphs, TODO·NOTE inside comments
[[language]]
name = "markdown.inline"
grammar = "markdown_inline"

[[language]]
name = "comment"

