# tarae default keymap — a subset of helix's default keymap, same syntax, same command names.
# User config ~/.config/tarae/config.toml's [keys.normal|select|insert] is merged on top of this.
# [select] inherits [normal] and overrides only what is listed here.

[normal]
# Debugger (IDE convention): F5 start/continue · F9 breakpoint · F10 step over · F11 step in · F12 step out
F5 = "dap_launch"
F9 = "toggle_breakpoint"
F10 = "dap_next"
F11 = "dap_step_in"
F12 = "dap_step_out"
h = "move_char_left"
j = "move_visual_line_down"
k = "move_visual_line_up"
l = "move_char_right"
left = "move_char_left"
down = "move_visual_line_down"
up = "move_visual_line_up"
right = "move_char_right"
w = "move_next_word_start"
b = "move_prev_word_start"
e = "move_next_word_end"
G = "goto_line"
home = "goto_line_start"
end = "goto_line_end"
C-f = "page_down"
C-b = "page_up"
C-d = "half_page_down"
C-u = "half_page_up"
pagedown = "page_down"
pageup = "page_up"
"A-." = "repeat_last_motion"
C-o = "jump_backward"
C-i = "jump_forward"
tab = "jump_forward"
C-s = "save_selection"

v = "select_mode"
":" = "command_mode"
esc = "normal_mode"

i = "insert_mode"
a = "append_mode"
I = "insert_at_line_start"
A = "insert_at_line_end"
o = "open_below"
O = "open_above"

d = "delete_selection"
"A-d" = "delete_selection_noyank"
c = "change_selection"
"A-c" = "change_selection_noyank"
y = "yank"
p = "paste_after"
P = "paste_before"
u = "undo"
U = "redo"

x = "extend_line_below"
# Select lines upward one at a time (mirror of x) — one more line per press
X = ["extend_line_up", "extend_to_line_bounds"]
A-x = "extend_to_line_bounds"
";" = "collapse_selection"
"A-;" = "flip_selections"
"," = "keep_primary_selection"
"%" = "select_all"
C = "copy_selection_on_next_line"
"A-C" = "copy_selection_on_prev_line"

f = "find_next_char"
t = "find_till_char"
F = "find_prev_char"
T = "till_prev_char"
r = "replace"
"~" = "switch_case"
"`" = "switch_to_lowercase"
"A-`" = "switch_to_uppercase"
">" = "indent"
"<" = "unindent"
J = "join_selections"
'"' = "select_register"
Q = "record_macro"
q = "replay_macro"

"/" = "search"
"?" = "rsearch"
n = "search_next"
N = "search_prev"
"*" = "search_selection"
s = "select_regex"
S = "split_selection"
"A-s" = "split_selection_on_newline"
K = "keep_selections"
"A-K" = "remove_selections"

[normal."]"]
d = "goto_next_diag"
t = "goto_next_test_failure"
g = "goto_next_change"

[normal."["]
d = "goto_prev_diag"
t = "goto_prev_test_failure"
g = "goto_prev_change"

[normal.space.g]
a = "dap_attach"
b = "toggle_breakpoint"
l = "dap_launch"
c = "dap_launch"
n = "dap_next"
i = "dap_step_in"
o = "dap_step_out"
p = "dap_pause"
t = "dap_terminate"
C-c = "dap_edit_condition"
C-l = "dap_edit_log"
w = "dap_watch"
W = "dap_unwatch"

# Tests (x = run): test at cursor · debug · whole file · rerun last · close window
[normal.space.x]
x = "test_nearest"
d = "test_debug"
f = "test_file"
l = "test_last"
c = "test_close"

[normal."C-w"]
v = "vsplit"
s = "hsplit"
w = "rotate_view"
C-w = "rotate_view"
h = "jump_view_left"
l = "jump_view_right"
k = "jump_view_up"
j = "jump_view_down"
q = "wclose"
o = "wonly"

[normal.space.w]
v = "vsplit"
s = "hsplit"
w = "rotate_view"
C-w = "rotate_view"
h = "jump_view_left"
l = "jump_view_right"
k = "jump_view_up"
j = "jump_view_down"
q = "wclose"
o = "wonly"

[normal.space]
a = "code_action"
r = "rename_symbol"
i = "llm_ask"
l = "chat_open"
L = "chat_close"
c = "claude_code"
C = "claude_code_mention"
"?" = "command_palette"
t = "theme_picker"
s = "symbol_picker"
S = "workspace_symbol_picker"
k = "hover"
d = "diagnostics_picker"
f = "file_picker"
b = "buffer_picker"
"/" = "global_search"
y = "yank_to_clipboard"
p = "paste_clipboard_after"
P = "paste_clipboard_before"

[normal.m]
m = "match_brackets"
i = "select_textobject_inner"
a = "select_textobject_around"
s = "surround_add"
r = "surround_replace"
d = "surround_delete"

[normal.g]
d = "goto_definition"
D = "goto_declaration"
y = "goto_type_definition"
i = "goto_implementation"
r = "goto_reference"
a = "goto_last_accessed_file"
g = "goto_file_start"
e = "goto_last_line"
h = "goto_line_start"
l = "goto_line_end"
s = "goto_first_nonwhitespace"
n = "goto_next_buffer"
p = "goto_previous_buffer"

[select]
h = "extend_char_left"
j = "extend_visual_line_down"
k = "extend_visual_line_up"
l = "extend_char_right"
left = "extend_char_left"
down = "extend_visual_line_down"
up = "extend_visual_line_up"
right = "extend_char_right"
w = "extend_next_word_start"
b = "extend_prev_word_start"
e = "extend_next_word_end"
v = "normal_mode"
esc = "normal_mode"

[insert]
esc = "normal_mode"
ret = "insert_newline"
tab = "insert_tab"
C-x = "completion"
backspace = "delete_char_backward"
del = "delete_char_forward"
left = "move_char_left"
down = "move_visual_line_down"
up = "move_visual_line_up"
right = "move_char_right"
